- name: Extract errors + source (highlighted)
  if: steps.gradle_build.outputs.exit_code != '0'
  run: |
    mkdir -p build_error_logs

    {
      echo "==== GRADLE BUILD ERROR REPORT ===="
      echo
      echo "-- COMPILE / RESOURCE ERRORS --"
      # Capture real errors: either ": error" or Kotlin compiler "e:" lines
      grep -E "(\.kt|\.java|\.xml|\.gradle|\.properties):[0-9]+: error|^e: " build_error_logs/build_output.txt || true
      echo
      echo "-- BUILD FAILURE / EXCEPTIONS --"
      grep -E "(BUILD FAILED|FAILURE:|Exception|Caused by:)" build_error_logs/build_output.txt || true
      echo
      echo "==== SOURCE CODE (UNIQUE ERROR FILES) ===="
    } > build_error_logs/error_files.txt

    # Extract file:line info for errors only
    grep -Eo "([a-zA-Z0-9_/.-]+\.(kt|java|xml|gradle|properties)):[0-9]+" build_error_logs/build_output.txt \
      | grep -v ":.*warning" | sort -u > build_error_logs/error_locations.txt || true

    # Process each unique file
    cut -d: -f1 build_error_logs/error_locations.txt | sort -u | while read -r file; do
      if [ -f "$file" ]; then
        REL_PATH=$(realpath --relative-to="$GITHUB_WORKSPACE" "$file")
        echo "" >> build_error_logs/error_files.txt
        echo "//===== FILE: $REL_PATH =====" >> build_error_logs/error_files.txt

        # Collect error line numbers
        grep "^$file:" build_error_logs/error_locations.txt \
          | cut -d: -f2 | sort -n | uniq > build_error_logs/_lines.tmp

        # Dump file once with highlighted error lines
        nl -ba "$file" | while read -r line; do
          LINE_NO=$(echo "$line" | awk '{print $1}')
          if grep -qx "$LINE_NO" build_error_logs/_lines.tmp; then
            echo ">>>>> ERROR HERE" >> build_error_logs/error_files.txt
          fi
          echo "$line" >> build_error_logs/error_files.txt
        done
      fi
    done

    rm -f build_error_logs/_lines.tmp build_error_logs/error_locations.txt
    cat build_error_logs/error_files.txt
