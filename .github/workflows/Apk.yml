name: Build Flutter APK

on:
  workflow_run:
    workflows: ["Extract Repo Source to TXT"]
    types:
      - completed
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.workspace }}/.pub-cache
          key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        continue-on-error: true
        run: |
          mkdir -p build_error_logs
          flutter analyze > build_error_logs/analyze_output.txt 2>&1 || true

      # ---------------- BUILD (never hard-fails) ----------------
      - name: Build Flutter APK and capture log
        id: flutter_build
        continue-on-error: true
        run: |
          mkdir -p build_error_logs
          flutter build apk --debug --verbose \
            2>&1 | tee build_error_logs/build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      # ---------------- APK UPLOAD ----------------
      - name: Upload Debug APK
        if: steps.flutter_build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      # ---------------- ERROR + SOURCE EXTRACTION ----------------
      - name: Extract errors + source (highlighted)
        if: steps.flutter_build.outputs.exit_code != '0'
        run: |
          mkdir -p build_error_logs

          {
            echo "==== FLUTTER BUILD ERROR REPORT ===="
            echo
            echo "-- DART COMPILE ERRORS --"
            # Flutter/Dart errors
            grep -E "(\.dart|\.yaml):[0-9]+:[0-9]+: Error|Error:|Exception:" build_error_logs/build_output.txt || true
            echo
            echo "-- ANDROID BUILD ERRORS --"
            # Gradle/Android errors
            grep -E "(\.kt|\.java|\.xml|\.gradle):[0-9]+: error|^e: " build_error_logs/build_output.txt || true
            echo
            echo "-- BUILD FAILURE / EXCEPTIONS --"
            grep -E "(BUILD FAILED|FAILURE:|Exception|Caused by:|Gradle build failed)" build_error_logs/build_output.txt || true
            echo
            echo "-- FLUTTER ANALYZE OUTPUT --"
            cat build_error_logs/analyze_output.txt || true
            echo
            echo "==== SOURCE CODE (UNIQUE ERROR FILES) ===="
          } > build_error_logs/error_files.txt

          # Extract Dart file errors
          grep -Eo "([a-zA-Z0-9_/.-]+\.dart):[0-9]+:[0-9]+" build_error_logs/build_output.txt \
            | sort -u > build_error_logs/dart_errors.txt || true

          # Extract Android file errors
          grep -Eo "([a-zA-Z0-9_/.-]+\.(kt|java|xml|gradle)):[0-9]+" build_error_logs/build_output.txt \
            | grep -v ":.*warning" | sort -u > build_error_logs/android_errors.txt || true

          # Combine all error locations
          cat build_error_logs/dart_errors.txt build_error_logs/android_errors.txt \
            | sort -u > build_error_logs/error_locations.txt || true

          # Process each unique file
          cut -d: -f1 build_error_logs/error_locations.txt | sort -u | while read -r file; do
            if [ -f "$file" ]; then
              REL_PATH=$(realpath --relative-to="$GITHUB_WORKSPACE" "$file" 2>/dev/null || echo "$file")
              echo "" >> build_error_logs/error_files.txt
              echo "//===== FILE: $REL_PATH =====" >> build_error_logs/error_files.txt

              # Collect error line numbers
              grep "^$file:" build_error_logs/error_locations.txt \
                | cut -d: -f2 | sort -n | uniq > build_error_logs/_lines.tmp

              # Dump file with highlighted error lines
              nl -ba "$file" 2>/dev/null | while read -r line; do
                LINE_NO=$(echo "$line" | awk '{print $1}')
                if grep -qx "$LINE_NO" build_error_logs/_lines.tmp 2>/dev/null; then
                  echo ">>>>> ERROR HERE" >> build_error_logs/error_files.txt
                fi
                echo "$line" >> build_error_logs/error_files.txt
              done
            fi
          done

          rm -f build_error_logs/_lines.tmp build_error_logs/dart_errors.txt build_error_logs/android_errors.txt build_error_logs/error_locations.txt
          cat build_error_logs/error_files.txt

      # ---------------- COMMIT ERROR REPORT (safe push) ----------------
      - name: Commit & push error report
        if: steps.flutter_build.outputs.exit_code != '0'
        run: |
          git config user.name "flutter-build-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build_error_logs/error_files.txt
          git add build_error_logs/build_output.txt
          git add build_error_logs/analyze_output.txt
          git commit -m "Auto: Flutter build error report with source highlighting" || echo "No changes"
          git fetch origin main
          git push origin main

      # ---------------- FINAL FAILURE SIGNAL ----------------
      - name: Fail job if build failed
        if: steps.flutter_build.outputs.exit_code != '0'
        run: exit 1

      # ---------------- SUCCESS METRICS ----------------
      - name: Build success summary
        if: steps.flutter_build.outputs.exit_code == '0'
        run: |
          echo "✅ Flutter APK built successfully"
          ls -lh build/app/outputs/flutter-apk/app-debug.apk
          echo "APK size: $(du -h build/app/outputs/flutter-apk/app-debug.apk | cut -f1)"
