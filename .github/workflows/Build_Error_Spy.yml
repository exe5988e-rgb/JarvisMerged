name: Capture Build Errors

on:
  workflow_run:
    workflows: ["Build APK"]
    types:
      - completed

permissions:
  contents: write

jobs:
  capture-errors:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Capture Gradle errors
        run: |
          chmod +x ./gradlew
          mkdir -p build_error_logs
          ./gradlew build --dry-run --warning-mode=all > build_error_logs/build_output.txt || true
          grep -E "\.java|\.kt|\.xml" build_error_logs/build_output.txt | sort | uniq > build_error_logs/error_files.txt
          cat build_error_logs/error_files.txt

      - name: Commit & push error files
        run: |
          git config user.name "build-error-bot"
          git config user.email "bot@users.noreply.github.com"
          git add build_error_logs/error_files.txt
          git commit -m "Auto: Gradle build error files" || echo "No changes"
          git push
      
